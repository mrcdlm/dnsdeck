# Local development: builds the image from source (repository root).
#   docker compose -f docker-compose.dev.yml up -d --build
services:
  dnsdeck:
    build:
      context: ..
      args:
        VERSION: dev
    image: dnsdeck:dev
    container_name: dnsdeck
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Read-only root filesystem: the app only writes to /data (database) and
    # /tmp (SQLite temp files for large queries).
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${DNSDECK_PORT:-8080}:8080"
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data:Z
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
