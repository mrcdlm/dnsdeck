services:
  dnsdeck:
    # Solange es noch kein Image auf ghcr.io gibt (ab Meilenstein 5), lokal bauen.
    # Danach "build" entfernen und das Image wieder aktivieren:
    # image: ghcr.io/mrcdlm/dnsdeck:latest
    build: ..
    container_name: dnsdeck
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      # Stack liegt unter /opt/stacks/dnsdeck/ → Daten landen in /opt/stacks/dnsdeck/data
      # ":Z" setzt das SELinux-Label (auf MicroOS nötig)
      # Der Container läuft als UID 65532: einmalig "sudo chown 65532:65532 data"
      - ./data:/data:Z
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
