services:
  dnsdeck:
    image: ghcr.io/DEIN-GITHUB-NAME/dnsdeck:latest
    # Während der Entwicklung stattdessen lokal bauen:
    # build: ..
    container_name: dnsdeck
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      # Stack liegt unter /opt/stacks/dnsdeck/ → Daten landen in /opt/stacks/dnsdeck/data
      # ":Z" setzt das SELinux-Label (auf MicroOS nötig)
      - ./data:/data:Z
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
