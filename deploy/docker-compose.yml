# Stack: /opt/stacks/dnsdeck, Daten: /srv/dnsdeck, Version in .env
# Einmalig: mkdir -p /srv/dnsdeck && chown 65532:65532 /srv/dnsdeck
# Update: DNSDECK_VERSION in .env erhöhen (Release Notes lesen), dann
#   docker compose pull && docker compose up -d
# Lokal aus dem Quellcode bauen: docker-compose.dev.yml
name: dnsdeck
services:
  dnsdeck:
    # Feste Version aus .env, nie latest
    image: ghcr.io/mrcdlm/dnsdeck:${DNSDECK_VERSION:?DNSDECK_VERSION in .env setzen, z. B. 0.1.0}
    container_name: dnsdeck
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      # ":Z" setzt das SELinux-Label (auf MicroOS nötig)
      - /srv/dnsdeck:/data:Z
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
