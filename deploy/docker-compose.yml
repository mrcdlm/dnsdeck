# Produktion: Image von ghcr.io (gebaut von .github/workflows/release.yml).
# Aktualisieren:  docker compose pull && docker compose up -d
# Lokal aus dem Quellcode bauen: docker-compose.dev.yml
services:
  dnsdeck:
    # :latest = neuestes Release; für feste Versionen z. B. :1.0.0 oder :1
    image: ghcr.io/mrcdlm/dnsdeck:latest
    container_name: dnsdeck
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      # Stack liegt unter /opt/stacks/dnsdeck/ → Daten landen in /opt/stacks/dnsdeck/data
      # ":Z" setzt das SELinux-Label (auf MicroOS nötig)
      # Der Container läuft als UID 65532: einmalig "sudo chown 65532:65532 data"
      - ./data:/data:Z
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
