# Produktion: Image von ghcr.io (gebaut von .github/workflows/release.yml).
# Aktualisieren: DNSDECK_VERSION in .env erhöhen, dann
#   docker compose pull && docker compose up -d
# Lokal aus dem Quellcode bauen: docker-compose.dev.yml
services:
  dnsdeck:
    # Feste Version aus .env (DNSDECK_VERSION), nie latest: Updates bewusst
    # nach Lesen der Release Notes (github.com/mrcdlm/dnsdeck/releases).
    image: ghcr.io/mrcdlm/dnsdeck:${DNSDECK_VERSION:?DNSDECK_VERSION in .env setzen, z. B. 0.1.0}
    container_name: dnsdeck
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      TZ: Europe/Berlin
    volumes:
      # Stack liegt unter /opt/stacks/dnsdeck/ → Daten landen in /opt/stacks/dnsdeck/data
      # ":Z" setzt das SELinux-Label (auf MicroOS nötig)
      # Der Container läuft als UID 65532: einmalig "sudo chown 65532:65532 data"
      - ./data:/data:Z
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
